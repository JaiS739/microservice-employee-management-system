spring.application.name=employee-service
server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/employee_db
spring.datasource.username=root
spring.datasource.password=Pillu!00739
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
services.department.base-url=http://localhost:8082
spring.http.client.connect-timeout=2s
spring.http.client.read-timeout=3s
# Circuit Breaker for Department Service
resilience4j.circuitbreaker.instances.departmentService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.departmentService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.departmentService.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.departmentService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.departmentService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.departmentService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.departmentService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.departmentService.ignoreExceptions=com.microservices.employee_service.exception.DepartmentResourceNotFound
# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always